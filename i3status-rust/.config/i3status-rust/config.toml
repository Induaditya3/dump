[theme]
theme = "space-villain"

[icons]
icons = "material-nf"

[[block]]
block = "menu"
text = "\uf011"
[[block.items]]
display = " -&gt; Power Off &lt;-"
cmd = "poweroff"
confirm_msg = "Are you sure you want to power off?"
[[block.items]]
display = " -&gt;   Sleep   &lt;-"
cmd = "systemctl suspend"
[[block.items]]
display = " -&gt;  Reboot   &lt;-"
cmd = "reboot"
confirm_msg = "Are you sure you want to reboot?"

[[block]]
block = "disk_space"
info_type = "available"
alert_unit = "GB"
alert = 7.0
warning = 10.0
format = " $icon $available "
format_alt = " $icon $available / $total "


[[block]]
block = "music"
format = " $icon {$combo.str(max_w:20) $play $prev $next |}"


[[block]]
block = "uptime"
interval = 60

[[block]]
block = "pomodoro"
notify_cmd = "notify-send '{msg}'"
blocking_cmd = false

[[block]]
block = "temperature"
format = " $icon $max max "
format_alt = " $icon $min min, $max max, $average avg "
interval = 10
chip = "*-isa-*"


[[block]]
block = "cpu"
interval = 1
format = " $icon $utilization "

[[block]]
block = "backlight"
device = "intel_backlight" 
format = " $icon $brightness "

[[block]]
block = "memory"
format = " $icon $mem_used "
format_alt = " $icon_swap $swap_free.eng(w:3,u:B,p:Mi)/$swap_total.eng(w:3,u:B,p:Mi)($swap_used_percents.eng(w:2)) "
interval = 30
warning_mem = 70
critical_mem = 90

[[block]]
block = "net"
device = "wlan0"
format = " $icon $ssid "
format_alt = " $icon { $frequency $ip|Wired connection} via $device "
interval = 5

[[block]]
block = "hueshift"
hue_shifter = "redshift"
step = 50
click_temp = 3500

[[block]]
block = "sound"
step_width = 5
[[block.click]]
button = "left" 
cmd = "pavucontrol"

[[block]]
block = "battery"
# The update interval in seconds (only affects 'sysfs' and 'apc_ups' drivers)
interval = 10

# Logic Drivers: "sysfs" (direct kernel read, default) or "upower" (standard on GNOME/KDE)
driver = "sysfs"

# Optional: Specify which battery to monitor (e.g., "BAT0", "BAT1"). 
# "DisplayDevice" with UPower merges all batteries into one logical status.
# device = "BAT0"

# --- Formatting ---
# Each state can have its own look. 
# $icon automatically cycles based on percentage if using Nerd Fonts/Font Awesome.
format = " $icon $percentage $time_remaining "
full_format = " $icon Full "              # Shown when battery > full_threshold
charging_format = " $icon $percentage ⚡ " # Shown when power source is plugged in
empty_format = " $icon EMPTY! "           # Shown when battery < empty_threshold
not_charging_format = " $icon AC "        # Shown when plugged in but not charging
missing_format = " No Battery "           # Shown if battery is physically removed

# --- State Thresholds (Determines Color) ---
# Values are percentages. Colors are pulled from your [theme] section.
good = 70       # >= 70%: 'Good' state (usually green)
info = 60       # >= 60%: 'Info' state (usually blue)
warning = 30    # < 30%: 'Warning' state (usually yellow)
critical = 15   # < 15%: 'Critical' state (usually red)

# --- Behavior Thresholds ---
full_threshold = 95    # Consider "Full" even if not 100% (saves battery health)
empty_threshold = 10.0  # Consider "Empty" at 10% to trigger empty_format early



[[block]] 
block = "time" 
interval = 1 
format = " $icon $timestamp.datetime(f:'%a %d %B %I:%M %p') "
